<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
        />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>ANTE - LIVE</title>
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/live.css" />
        <script src="js/live.js" defer></script>
    </head>
    <body>
        <main class="live">
            <h1 class="page-title">LIVE</h1>

            <section class="live-board" id="live-board">
                <div class="players-panel">
                    <h2>Active players</h2>
                    <ul id="active-players-list"></ul>

                    <h2>Eliminated players</h2>
                    <ul id="eliminated-players-list"></ul>
                </div>

                <div class="timer-controls">
                    <button type="button" id="stop-timer-button" class="button">STOP</button>
                    <button type="button" id="resume-timer-button" class="button">RESUME</button>
                </div>

                <div class="timer-display">
                    <p class="timer-label">Next blinds in</p>
                    <p id="timer">--:--</p>
                </div>

                <div class="chips-panel">
                    <h2>Chips</h2>
                    <ul id="chips-list"></ul>
                </div>
            </section>

            <section class="live-section" id="blinds-section">
                <p class="blind pot">
                    <span class="blind-label">Pot</span>
                    <span class="pot-amount">
                        <span class="blind-value" id="current-pot"></span>
                        <span class="pot-currency" id="pot-currency"></span>
                    </span>
                </p>
                <p class="blind">
                    <span class="blind-label">Small blind</span>
                    <span class="blind-value" id="current-small-blind"></span>
                </p>
                <p class="blind">
                    <span class="blind-label">Big blind</span>
                    <span class="blind-value" id="current-big-blind"></span>
                </p>
                <button type="button" id="finish-game-button" class="button">FINISH</button>
            </section>
        </main>
    </body>
</html>
