<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
        />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>ANTE - SETUP</title>
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/setup.css" />
        <script src="js/setup.js" defer></script>
    </head>
    <body>
        <main class="setup">
            <h1 class="page-title">SETUP</h1>

            <form id="setup-form">
                <section class="setup-section" id="players-section">
                    <h2>Players</h2>
                    <ul id="players-list">
                        <li class="player-row">
                            <input type="text" class="player-name" placeholder="Player name" />
                            <button type="button" class="remove-player">X</button>
                        </li>
                        <li class="player-row">
                            <input type="text" class="player-name" placeholder="Player name" />
                            <button type="button" class="remove-player">X</button>
                        </li>
                    </ul>
                    <button type="button" id="add-player" class="add-button">+ Add Player</button>
                </section>

                <section class="setup-section" id="chips-section">
                    <h2>Chip Denominations</h2>
                    <ul id="chips-list">
                        <li class="chip-row">
                            <select class="chip-color">
                                <option value="" disabled selected>Color</option>
                                <option value="white">White</option>
                                <option value="red">Red</option>
                                <option value="blue">Blue</option>
                                <option value="green">Green</option>
                                <option value="black">Black</option>
                                <option value="purple">Purple</option>
                                <option value="yellow">Yellow</option>
                                <option value="orange">Orange</option>
                                <option value="pink">Pink</option>
                                <option value="grey">Grey</option>
                            </select>
                            <input type="number" class="chip-value" placeholder="Value" min="5" step="5" />
                            <button type="button" class="remove-chip">X</button>
                        </li>
                        <li class="chip-row">
                            <select class="chip-color">
                                <option value="" disabled selected>Color</option>
                                <option value="white">White</option>
                                <option value="red">Red</option>
                                <option value="blue">Blue</option>
                                <option value="green">Green</option>
                                <option value="black">Black</option>
                                <option value="purple">Purple</option>
                                <option value="yellow">Yellow</option>
                                <option value="orange">Orange</option>
                                <option value="pink">Pink</option>
                                <option value="grey">Grey</option>
                            </select>
                            <input type="number" class="chip-value" placeholder="Value" min="5" step="5" />
                            <button type="button" class="remove-chip">X</button>
                        </li>
                    </ul>
                    <button type="button" id="add-chip" class="add-button">+ Add Chip</button>
                </section>

                <section class="setup-section" id="payouts-section">
                    <h2>Payouts</h2>
                    <ul id="payouts-list">
                        <li class="payout-row">
                            <label>Place <input type="number" class="payout-place" value="1" min="1" /></label>
                            <label
                                >Percentage
                                <input type="number" class="payout-percentage" value="70" min="1" max="100" />%</label
                            >
                            <button type="button" class="remove-payout">X</button>
                        </li>
                        <li class="payout-row">
                            <label>Place <input type="number" class="payout-place" value="2" min="1" /></label>
                            <label
                                >Percentage
                                <input type="number" class="payout-percentage" value="30" min="1" max="100" />%</label
                            >
                            <button type="button" class="remove-payout">X</button>
                        </li>
                    </ul>
                    <button type="button" id="add-payout" class="add-button">+ Add Payout</button>
                </section>

                <section class="setup-section" id="blind-section">
                    <h2>Blind</h2>
                    <label class="field"
                        >Starting small blind
                        <input type="number" id="small-blind-value" min="5" step="5" value="5" />
                    </label>
                    <label class="field"
                        >Blind increase interval (minutes)
                        <input type="number" id="blind-increase-minutes" min="1" value="30" />
                    </label>
                </section>

                <section class="setup-section" id="ladder-section">
                    <h2>Blind Ladder</h2>
                    <label class="field"
                        >Number of levels
                        <input type="number" id="level-count" value="8" min="2" max="16" />
                    </label>

                    <table id="level-increases-table">
                        <thead>
                            <tr>
                                <th>Level</th>
                                <th>Small Blind</th>
                                <th>Big Blind</th>
                                <th>Increase (%)</th>
                            </tr>
                        </thead>
                        <tbody id="level-one-table">
                            <tr>
                                <td class="level-label">1</td>
                                <td class="level-small-blind" id="level-one-small">-</td>
                                <td class="level-big-blind" id="level-one-big">-</td>
                            </tr>
                        </tbody>
                        <tbody id="level-increases-list"></tbody>
                    </table>

                    <label class="field"
                        ><span id="overtime-increase-text">Overtime increase (level N+)</span>
                        <select id="overtime-increase">
                            <option value="THIRD">+33%</option>
                            <option value="HALF">+50%</option>
                            <option value="DOUBLE" selected>+100%</option>
                        </select>
                    </label>
                    <label class="field"
                        >Starting stack value per player
                        <input type="number" id="chips-value-per-player" min="5" value="1000" step="5" />
                    </label>
                </section>

                <section class="setup-section" id="money-section">
                    <h2>Money</h2>
                    <label class="field"
                        >Buy-in value
                        <input type="number" id="buy-in-value" min="1" value="10" />
                    </label>
                    <label class="field"
                        >Currency
                        <input type="text" id="currency" placeholder="EUR" value="EUR" />
                    </label>
                </section>

                <button type="submit" id="start-game-button" class="button">START GAME</button>
                <div id="errors-list"></div>
            </form>
        </main>
    </body>
</html>
